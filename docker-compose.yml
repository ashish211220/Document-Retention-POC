version: '3.8'

services:
  # ── FastAPI Application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: doc-retention-poc:local
    container_name: doc-retention-app
    ports:
      - "8000:8000"
    env_file:
      - .env          # loads all Azure credentials from your local .env file
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Local PostgreSQL (for offline dev — NOT used when pointing at Azure) ──
  db:
    image: postgres:15-alpine
    container_name: doc-retention-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: document_retention
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d document_retention"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
